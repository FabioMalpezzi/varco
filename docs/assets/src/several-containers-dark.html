<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>Several containers on the same server</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .frame > .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; line-height: 1.2; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 880px; display: block; }
    @media print {
      .frame > .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }

    /* ---- diagram: structure (the same in the light and dark sources) ---- */
    .t-name { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .t-part { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; }
    .t-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; }
    .t-sub  { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; }
    .t-subb { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; }
    .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 400; }
    .t-msg  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
    .t-eye  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; }
    .t-fig  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; font-weight: 600; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .sheet { stroke-width: 1; }
    .zone { stroke-width: 1.2; }
    .zone.vm { stroke-dasharray: 7 5; }
    .ctr { fill: none; stroke-width: 1; }
    .band { stroke-width: 1.2; }
    .n-prog, .n-part, .n-file, .n-none { stroke-width: 1; }
    .n-end { stroke-width: 1.5; }
    .n-gpu { stroke-width: 1; stroke-linejoin: round; }
    .n-none, .dashed { stroke-dasharray: 4 3; }
    .n-fold { fill: none; stroke-width: 1; }
    .ln { fill: none; stroke-width: 1.5; stroke-linejoin: round; }
    .ln.strong { stroke-width: 2.4; }
    .ln.back { stroke-dasharray: 5 4; }
    .ln.faint { stroke-width: 1.2; stroke-dasharray: 2 4; }
    .rule { fill: none; stroke-width: 1; }

    body { background: #0d1117; color: #f5f5f5; }
    .sheet { fill: #2d3142; stroke: #4d505f; }

    .band { fill: #4e4046; stroke: #f08a59; }

    .bar { fill: #767881; }
    .bar-ink { fill: #f5f5f5; }

    .mk-faint { fill: #888a90; }

    .c-ink { fill: #f5f5f5; }

    .c-soft { fill: #aab2c4; }

<body>
  <div class="frame">
    <p class="eyebrow">Use cases · varco</p>
    <h1>Several containers on the same server</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 880 716" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="several-containers-dark-title several-containers-dark-desc">
        <title id="several-containers-dark-title">Several containers on the same server</title>
        <desc id="several-containers-dark-desc">With MLX, two containers connect to one mlx-remote-server. Each connection has a thread that only queues work and its own copy of the weights; one executor thread runs the queued jobs one at a time on the Apple GPU, so the containers share one stream of work evenly and their total is what one gets alone. With PyTorch, bridge.server hands each connection to a bridge.session process of its own, so PyTorch containers share the GPU as separate programs on a Mac do. Measured with Qwen3.6-35B, tokens per second in total, one run each: one copy 122, two containers on one MLX server 129, two processes on the Mac directly 176.</desc>

          <marker id="arrow-faint" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon class="mk-faint" points="0 0, 10 4, 0 8"/></marker>
        </defs>
        <rect class="sheet" x="0.5" y="0.5" width="879" height="715" rx="10"/>
        <!-- zones: the virtual machine and macOS -->

          <text x="34" y="68" class="t-eye c-soft">LINUX VIRTUAL MACHINE</text>

          <rect class="zone vm" x="20" y="360" width="228" height="232" rx="8"/>

          <rect class="zone mac" x="340" y="360" width="520" height="232" rx="8"/>
          <text x="354" y="380" class="t-eye c-soft">macOS</text>
        </g>
        <!-- containers -->
        <g class="l-ctrs">

          <rect class="n-part" x="368" y="224" width="164" height="64" rx="6"/>

          <rect class="cell" x="552" y="156" width="36" height="24"/>

          <text x="570" y="244.5" class="t-mono c-muted mid">A</text>
          <rect class="cell" x="552" y="252" width="36" height="24"/>
          <text x="570" y="268.5" class="t-mono c-muted mid">B</text>
          <text x="570" y="124" class="t-sub c-muted mid">queue</text>
          <rect class="n-part" x="608" y="168" width="88" height="72" rx="6"/>
          <text x="652" y="199.1" class="t-part c-ink mid">executor</text>
          <text x="652" y="218.1" class="t-part c-ink mid">thread</text>
          <text x="652" y="258" class="t-sub c-muted mid">one job</text>
          <text x="652" y="274" class="t-sub c-muted mid">at a time</text>

          <rect class="n-prog" x="44" y="424" width="180" height="48" rx="6"/>
          <text x="134" y="444.8" class="t-name c-ink mid">program</text>
          <text x="134" y="461.8" class="t-sub c-muted mid">PyTorch</text>

          <rect class="n-end" x="356" y="416" width="176" height="164" rx="6"/>

          <text x="444" y="495.8" class="t-sub c-muted mid">the door:</text>
