<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 308" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-title overview-desc" id="overview-root">
        <title id="overview-title">varco: a program in a container computes on the Mac's GPU</title>
        <desc id="overview-desc">A program runs unchanged in a Linux container inside a virtual machine. The container end of the bridge, a backend inside the framework, sends the program's array operations over a channel to the Mac end, a server process on macOS, which computes them on the Apple GPU through Metal and sends back only the values the program reads.</desc>
        <defs>
      <style>#overview-root { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      #overview-root .t-name { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
      #overview-root .t-part { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; }
      #overview-root .t-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; }
      #overview-root .t-sub { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; }
      #overview-root .t-subb { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; }
      #overview-root .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 400; }
      #overview-root .t-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
      #overview-root .t-eye { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; }
      #overview-root .t-fig { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; font-weight: 600; }
      #overview-root .mid { text-anchor: middle; }
      #overview-root .end { text-anchor: end; }
      #overview-root .sheet { stroke-width: 1; }
      #overview-root .zone { stroke-width: 1.2; }
      #overview-root .zone.vm { stroke-dasharray: 7 5; }
      #overview-root .ctr { fill: none; stroke-width: 1; }
      #overview-root .band { stroke-width: 1.2; }
      #overview-root .n-prog, #overview-root .n-part, #overview-root .n-file, #overview-root .n-none { stroke-width: 1; }
      #overview-root .n-end { stroke-width: 1.5; }
      #overview-root .n-gpu { stroke-width: 1; stroke-linejoin: round; }
      #overview-root .n-none, #overview-root .dashed { stroke-dasharray: 4 3; }
      #overview-root .n-fold { fill: none; stroke-width: 1; }
      #overview-root .ln { fill: none; stroke-width: 1.5; stroke-linejoin: round; }
      #overview-root .ln.strong { stroke-width: 2.4; }
      #overview-root .ln.back { stroke-dasharray: 5 4; }
      #overview-root .ln.faint { stroke-width: 1.2; stroke-dasharray: 2 4; }
      #overview-root .rule { fill: none; stroke-width: 1; }
      #overview-root { color: #2d3142; }
      #overview-root .sheet { fill: #f5f5f5; stroke: #d5d6d8; }
      #overview-root .zone { fill: #eeeeef; stroke: #91939c; }
      #overview-root .ctr-fill { fill: #fafafa; }
      #overview-root .ctr-head { fill: #e1e1e3; }
      #overview-root .ctr { stroke: #878993; }
      #overview-root .band { fill: #f0e3e0; stroke: #bf4520; }
      #overview-root .n-prog { fill: #e4e6e9; stroke: #5a6580; }
      #overview-root .n-end { fill: #ffffff; stroke: #2d3142; }
      #overview-root .n-part { fill: #f4f5f6; stroke: #878993; }
      #overview-root .n-gpu { fill: #2d3142; stroke: #2d3142; }
      #overview-root .n-file { fill: #e5e5e7; stroke: #4f5d75; }
      #overview-root .n-fold { stroke: #4f5d75; }
      #overview-root .n-none { fill: none; stroke: #878993; }
      #overview-root .cell { fill: #f4f5f6; stroke: #878993; }
      #overview-root .cell-full { fill: #797b86; stroke: #878993; }
      #overview-root .bar { fill: #a2a9b5; }
      #overview-root .bar-ink { fill: #2d3142; }
      #overview-root .mask-paper { fill: #f5f5f5; }
      #overview-root .mask-zone { fill: #eeeeef; }
      #overview-root .mask-band { fill: #f0e3e0; }
      #overview-root .mask-end { fill: #ffffff; }
      #overview-root .ln { stroke: #4f5d75; }
      #overview-root .ln.strong { stroke: #2d3142; }
      #overview-root .ln.faint { stroke: #788395; }
      #overview-root .mk { fill: #4f5d75; }
      #overview-root .mk-strong { fill: #2d3142; }
      #overview-root .mk-faint { fill: #788395; }
      #overview-root .rule { stroke: #d1d2d5; }
      #overview-root .c-ink { fill: #2d3142; }
      #overview-root .c-muted { fill: #4f5d75; }
      #overview-root .c-soft { fill: #5a6580; }
      #overview-root .c-inv { fill: #f5f5f5; }
      #overview-root .c-inv2 { fill: #cdced1; }</style>
          <marker id="overview-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon class="mk" points="0 0, 10 4, 0 8"/></marker>
          <marker id="overview-arrow-strong" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon class="mk-strong" points="0 0, 12 5, 0 10"/></marker>
          <marker id="overview-arrow-faint" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon class="mk-faint" points="0 0, 10 4, 0 8"/></marker>
        </defs>
        <rect class="sheet" x="0.5" y="0.5" width="879" height="307" rx="10"/>
        <!-- zones: the virtual machine and macOS -->
        <g class="l-zones">
          <rect class="zone vm" x="20" y="20" width="364" height="268" rx="8"/>
          <text x="34" y="40" class="t-eye c-soft">LINUX VIRTUAL MACHINE</text>
          <text x="205.7" y="40" class="t-sub c-soft">Docker Desktop or Kiri</text>
          <rect class="zone mac" x="604" y="20" width="256" height="268" rx="8"/>
          <text x="618" y="40" class="t-eye c-soft">macOS</text>
        </g>
        <!-- containers -->
        <g class="l-ctrs">
          <rect class="ctr-fill" x="36" y="52" width="332" height="220" rx="6"/>
          <path class="ctr-head" d="M 36,76 V 58 Q 36,52 42,52 H 362 Q 368,52 368,58 V 76 Z"/>
          <rect class="ctr" x="36" y="52" width="332" height="220" rx="6"/>
          <text x="48" y="68.5" class="t-eye c-muted">CONTAINER</text>
        </g>
        <!-- the channel -->
        <g class="l-bands">
          <rect class="band" x="388" y="184" width="212" height="88" rx="6"/>
        </g>
        <!-- connectors -->
        <g class="l-lines">
          <path class="ln " d="M 202,152 L 202,196" marker-end="url(#overview-arrow)"/>
          <path class="ln " d="M 732,196 L 732,152" marker-end="url(#overview-arrow)"/>
          <path class="ln " d="M 352,216 L 624,216" marker-end="url(#overview-arrow)"/>
          <path class="ln back" d="M 624,240 L 352,240" marker-end="url(#overview-arrow)"/>
        </g>
        <!-- connector labels -->
        <g class="l-labels">
          <text x="494" y="205" class="t-sub c-ink mid">operations</text>
          <text x="494" y="260" class="t-sub c-ink mid">values the program reads</text>
        </g>
        <!-- nodes -->
        <g class="l-nodes">
          <rect class="n-prog" x="52" y="88" width="300" height="64" rx="6"/>
          <text x="202" y="116.8" class="t-name c-ink mid">your program</text>
          <text x="202" y="133.8" class="t-sub c-muted mid">MLX or PyTorch, unchanged</text>
          <rect class="n-end" x="52" y="196" width="300" height="64" rx="6"/>
          <text x="202" y="224.8" class="t-name c-ink mid">container end of the bridge</text>
          <text x="202" y="241.8" class="t-sub c-muted mid">a backend inside the framework</text>
          <polygon class="n-gpu" points="634,88 830,88 840,98 840,142 830,152 634,152 624,142 624,98"/>
          <text x="732" y="116.8" class="t-name c-inv mid">Apple GPU</text>
          <text x="732" y="133.8" class="t-sub c-inv2 mid">through Metal</text>
          <rect class="n-end" x="624" y="196" width="216" height="64" rx="6"/>
          <text x="732" y="224.8" class="t-name c-ink mid">Mac end of the bridge</text>
          <text x="732" y="241.8" class="t-sub c-muted mid">a server process</text>
        </g>
        <!-- notes -->
        <g class="l-text">
          <text x="494" y="150" class="t-eye c-soft mid">CHANNEL</text>
          <text x="494" y="168" class="t-sub c-muted mid">a TCP port, or Kiri's channel</text>
        </g>
      </svg>
