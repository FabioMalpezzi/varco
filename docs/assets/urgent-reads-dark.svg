<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="urgent-reads-dark-title urgent-reads-dark-desc" id="urgent-reads-dark-root">
        <title id="urgent-reads-dark-title">Urgent reads: a small read answered ahead of the queue</title>
        <desc id="urgent-reads-dark-desc">A generation loop reads one small value per token. The container has already sent the next step, a long GRAPH for the GPU, which waits in the server's queue for the one executor thread. It then sends a small graph marked urgent that reads one element of the step before. The executor thread takes it out of the queue first, runs it on the CPU, and answers with an EARLY frame; the long step gets its DONE frame in its turn. A long step is handed to the GPU in parts, so an urgent graph waits 0.25 to 0.3 ms; as an ordinary graph behind the next step the read waited 6.8 ms, where the Mac itself waits 1.6 ms.</desc>
        <defs>
      <style>#urgent-reads-dark-root { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      #urgent-reads-dark-root .t-name { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
      #urgent-reads-dark-root .t-part { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; }
      #urgent-reads-dark-root .t-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; }
      #urgent-reads-dark-root .t-sub { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; }
      #urgent-reads-dark-root .t-subb { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; }
      #urgent-reads-dark-root .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 400; }
      #urgent-reads-dark-root .t-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
      #urgent-reads-dark-root .t-eye { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; }
      #urgent-reads-dark-root .t-fig { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; font-weight: 600; }
      #urgent-reads-dark-root .mid { text-anchor: middle; }
      #urgent-reads-dark-root .end { text-anchor: end; }
      #urgent-reads-dark-root .sheet { stroke-width: 1; }
      #urgent-reads-dark-root .zone { stroke-width: 1.2; }
      #urgent-reads-dark-root .zone.vm { stroke-dasharray: 7 5; }
      #urgent-reads-dark-root .ctr { fill: none; stroke-width: 1; }
      #urgent-reads-dark-root .band { stroke-width: 1.2; }
      #urgent-reads-dark-root .n-prog, #urgent-reads-dark-root .n-part, #urgent-reads-dark-root .n-file, #urgent-reads-dark-root .n-none { stroke-width: 1; }
      #urgent-reads-dark-root .n-end { stroke-width: 1.5; }
      #urgent-reads-dark-root .n-gpu { stroke-width: 1; stroke-linejoin: round; }
      #urgent-reads-dark-root .n-none, #urgent-reads-dark-root .dashed { stroke-dasharray: 4 3; }
      #urgent-reads-dark-root .n-fold { fill: none; stroke-width: 1; }
      #urgent-reads-dark-root .ln { fill: none; stroke-width: 1.5; stroke-linejoin: round; }
      #urgent-reads-dark-root .ln.strong { stroke-width: 2.4; }
      #urgent-reads-dark-root .ln.back { stroke-dasharray: 5 4; }
      #urgent-reads-dark-root .ln.faint { stroke-width: 1.2; stroke-dasharray: 2 4; }
      #urgent-reads-dark-root .rule { fill: none; stroke-width: 1; }
      #urgent-reads-dark-root { color: #f5f5f5; }
      #urgent-reads-dark-root .sheet { fill: #2d3142; stroke: #4d505f; }
      #urgent-reads-dark-root .zone { fill: #353949; stroke: #91939c; }
      #urgent-reads-dark-root .ctr-fill { fill: #3b3f4f; }
      #urgent-reads-dark-root .ctr-head { fill: #494c5b; }
      #urgent-reads-dark-root .ctr { stroke: #9b9da4; }
      #urgent-reads-dark-root .band { fill: #4e4046; stroke: #f08a59; }
      #urgent-reads-dark-root .n-prog { fill: #393e4f; stroke: #aab2c4; }
      #urgent-reads-dark-root .n-end { fill: #474a59; stroke: #f5f5f5; }
      #urgent-reads-dark-root .n-part { fill: #373b4b; stroke: #9b9da4; }
      #urgent-reads-dark-root .n-gpu { fill: #f5f5f5; stroke: #f5f5f5; }
      #urgent-reads-dark-root .n-file { fill: #434756; stroke: #bfc0c0; }
      #urgent-reads-dark-root .n-fold { stroke: #bfc0c0; }
      #urgent-reads-dark-root .n-none { fill: none; stroke: #9b9da4; }
      #urgent-reads-dark-root .cell { fill: #373b4b; stroke: #9b9da4; }
      #urgent-reads-dark-root .cell-full { fill: #a9abb1; stroke: #9b9da4; }
      #urgent-reads-dark-root .bar { fill: #767881; }
      #urgent-reads-dark-root .bar-ink { fill: #f5f5f5; }
      #urgent-reads-dark-root .mask-paper { fill: #2d3142; }
      #urgent-reads-dark-root .mask-zone { fill: #353949; }
      #urgent-reads-dark-root .mask-band { fill: #4e4046; }
      #urgent-reads-dark-root .mask-end { fill: #474a59; }
      #urgent-reads-dark-root .ln { stroke: #bfc0c0; }
      #urgent-reads-dark-root .ln.strong { stroke: #f5f5f5; }
      #urgent-reads-dark-root .ln.faint { stroke: #888a90; }
      #urgent-reads-dark-root .mk { fill: #bfc0c0; }
      #urgent-reads-dark-root .mk-strong { fill: #f5f5f5; }
      #urgent-reads-dark-root .mk-faint { fill: #888a90; }
      #urgent-reads-dark-root .rule { stroke: #515462; }
      #urgent-reads-dark-root .c-ink { fill: #f5f5f5; }
      #urgent-reads-dark-root .c-muted { fill: #bfc0c0; }
      #urgent-reads-dark-root .c-soft { fill: #aab2c4; }
      #urgent-reads-dark-root .c-inv { fill: #2d3142; }
      #urgent-reads-dark-root .c-inv2 { fill: #555866; }</style>
          <marker id="urgent-reads-dark-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon class="mk" points="0 0, 10 4, 0 8"/></marker>
          <marker id="urgent-reads-dark-arrow-strong" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon class="mk-strong" points="0 0, 12 5, 0 10"/></marker>
          <marker id="urgent-reads-dark-arrow-faint" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon class="mk-faint" points="0 0, 10 4, 0 8"/></marker>
        </defs>
        <rect class="sheet" x="0.5" y="0.5" width="879" height="511" rx="10"/>
        <!-- zones: the virtual machine and macOS -->
        <g class="l-zones">
          <rect class="zone vm" x="20" y="20" width="280" height="364" rx="8"/>
          <text x="34" y="40" class="t-eye c-soft">LINUX VIRTUAL MACHINE</text>
          <rect class="zone mac" x="440" y="20" width="420" height="364" rx="8"/>
          <text x="454" y="40" class="t-eye c-soft">macOS</text>
        </g>
        <!-- containers -->
        <g class="l-ctrs">
          <rect class="ctr-fill" x="32" y="52" width="256" height="320" rx="6"/>
          <path class="ctr-head" d="M 32,76 V 58 Q 32,52 38,52 H 282 Q 288,52 288,58 V 76 Z"/>
          <rect class="ctr" x="32" y="52" width="256" height="320" rx="6"/>
          <text x="44" y="68.5" class="t-eye c-muted">CONTAINER</text>
          <rect class="n-end" x="452" y="132" width="396" height="228" rx="6"/>
          <text x="466" y="154" class="t-code c-ink">mlx-remote-server</text>
        </g>
        <!-- the channel -->
        <g class="l-bands">
          <rect class="band" x="304" y="180" width="132" height="180" rx="6"/>
        </g>
        <!-- connectors -->
        <g class="l-lines">
          <path class="ln " d="M 160,144 L 160,168" marker-end="url(#urgent-reads-dark-arrow)"/>
          <path class="ln " d="M 276,216 L 464,216" marker-end="url(#urgent-reads-dark-arrow)"/>
          <path class="ln strong" d="M 276,260 L 464,260" marker-end="url(#urgent-reads-dark-arrow-strong)"/>
          <path class="ln strong back" d="M 464,300 L 276,300" marker-end="url(#urgent-reads-dark-arrow-strong)"/>
          <path class="ln back" d="M 764,248 L 764,332 Q 764,340 756,340 L 276,340" marker-end="url(#urgent-reads-dark-arrow)"/>
          <path class="ln " d="M 632,216 L 652,216" marker-end="url(#urgent-reads-dark-arrow)"/>
          <path class="ln " d="M 708,216 L 728,216" marker-end="url(#urgent-reads-dark-arrow)"/>
          <path class="ln " d="M 800,184 L 800,108" marker-end="url(#urgent-reads-dark-arrow)"/>
        </g>
        <!-- connector labels -->
        <g class="l-labels">
          <text x="370" y="206" class="t-msg c-muted mid">GRAPH step n+1</text>
          <text x="370" y="249" class="t-msg c-ink mid">GRAPH, urgent</text>
          <text x="370" y="289" class="t-msg c-ink mid">EARLY</text>
          <text x="370" y="330" class="t-msg c-muted mid">DONE step n+1</text>
          <text x="790" y="126" class="t-sub c-muted end">in parts</text>
        </g>
        <!-- nodes -->
        <g class="l-nodes">
          <rect class="n-prog" x="44" y="88" width="232" height="56" rx="6"/>
          <text x="160" y="112.8" class="t-name c-ink mid">generation loop</text>
          <text x="160" y="129.8" class="t-sub c-muted mid">reads one small value per token</text>
          <rect class="n-end" x="44" y="168" width="232" height="192" rx="6"/>
          <text x="58" y="191" class="t-name c-ink">container end</text>
          <text x="58" y="220" class="t-sub c-muted">step n+1: long, for the GPU</text>
          <text x="58" y="264" class="t-sub c-ink">urgent: one element of step n</text>
          <text x="58" y="304" class="t-sub c-ink">gets the value</text>
          <text x="58" y="344" class="t-sub c-muted">gets step n+1's outputs</text>
          <polygon class="n-gpu" points="722,52 834,52 844,62 844,98 834,108 722,108 712,98 712,62"/>
          <text x="778" y="84.8" class="t-name c-inv mid">Apple GPU</text>
          <rect class="n-part" x="464" y="168" width="168" height="148" rx="6"/>
          <text x="476" y="189" class="t-part c-ink">connection thread</text>
          <text x="476" y="220" class="t-sub c-muted">queues the step</text>
          <text x="476" y="264" class="t-sub c-ink">the executor takes the</text>
          <text x="476" y="280" class="t-sub c-ink">urgent graph first and</text>
          <text x="476" y="296" class="t-sub c-ink">runs it on the CPU</text>
          <rect class="cell" x="652" y="200" width="16" height="32" rx="2"/>
          <rect class="cell" x="672" y="200" width="16" height="32" rx="2"/>
          <rect class="cell-full" x="692" y="200" width="16" height="32" rx="2"/>
          <text x="680" y="192" class="t-sub c-muted mid">queue</text>
          <text x="644" y="252" class="t-sub c-muted">waits its turn</text>
          <rect class="n-part" x="728" y="184" width="108" height="64" rx="6"/>
          <text x="782" y="211.1" class="t-part c-ink mid">executor</text>
          <text x="782" y="230.1" class="t-part c-ink mid">thread</text>
        </g>
        <!-- notes -->
        <g class="l-text">
          <path class="rule" d="M 20,400 H 860"/>
          <text x="20" y="422" class="t-eye c-soft">ONE READ WAITS</text>
          <text x="20" y="450" class="t-fig c-ink">6.8 ms</text>
          <text x="20" y="469" class="t-sub c-muted">as an ordinary graph, behind the next step</text>
          <text x="340" y="450" class="t-fig c-ink">0.25–0.3 ms</text>
          <text x="340" y="469" class="t-sub c-muted">as an urgent graph</text>
          <text x="560" y="450" class="t-fig c-ink">1.6 ms</text>
          <text x="560" y="469" class="t-sub c-muted">on the Mac itself</text>
          <text x="20" y="496" class="t-sub c-muted">Answered early only if its inputs are already computed and its nodes only select, move or compare elements.</text>
        </g>
      </svg>
