<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 716" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="several-containers-title several-containers-desc" id="several-containers-root">
        <title id="several-containers-title">Several containers on the same server</title>
        <desc id="several-containers-desc">With MLX, two containers connect to one mlx-remote-server. Each connection has a thread that only queues work and its own copy of the weights; one executor thread runs the queued jobs one at a time on the Apple GPU, so the containers share one stream of work evenly and their total is what one gets alone. With PyTorch, bridge.server hands each connection to a bridge.session process of its own, so PyTorch containers share the GPU as separate programs on a Mac do. Measured with Qwen3.6-35B, tokens per second in total, one run each: one copy 122, two containers on one MLX server 129, two processes on the Mac directly 176.</desc>
