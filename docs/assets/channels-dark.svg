      #channels-dark-root .zone { fill: #353949; stroke: #91939c; }
      #channels-dark-root .ctr-fill { fill: #3b3f4f; }
      #channels-dark-root .ctr-head { fill: #494c5b; }
      #channels-dark-root .ctr { stroke: #9b9da4; }
      #channels-dark-root .band { fill: #4e4046; stroke: #f08a59; }
      #channels-dark-root .n-prog { fill: #393e4f; stroke: #aab2c4; }
      #channels-dark-root .n-end { fill: #474a59; stroke: #f5f5f5; }
      #channels-dark-root .n-part { fill: #373b4b; stroke: #9b9da4; }
      #channels-dark-root .n-gpu { fill: #f5f5f5; stroke: #f5f5f5; }
      #channels-dark-root .n-file { fill: #434756; stroke: #bfc0c0; }
      #channels-dark-root .n-fold { stroke: #bfc0c0; }
      #channels-dark-root .n-none { fill: none; stroke: #9b9da4; }
      #channels-dark-root .cell { fill: #373b4b; stroke: #9b9da4; }
      #channels-dark-root .cell-full { fill: #a9abb1; stroke: #9b9da4; }
      #channels-dark-root .bar { fill: #767881; }
      #channels-dark-root .bar-ink { fill: #f5f5f5; }
      #channels-dark-root .mask-paper { fill: #2d3142; }
      #channels-dark-root .mask-zone { fill: #353949; }
      #channels-dark-root .mask-band { fill: #4e4046; }
