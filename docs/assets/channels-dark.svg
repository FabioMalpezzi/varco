      #channels-dark-root .ln.strong { stroke-width: 2.4; }
      #channels-dark-root .ln.back { stroke-dasharray: 5 4; }
      #channels-dark-root .ln.faint { stroke-width: 1.2; stroke-dasharray: 2 4; }
      #channels-dark-root .rule { fill: none; stroke-width: 1; }
      #channels-dark-root { color: #f5f5f5; }
