<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 604" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="channels-dark-title channels-dark-desc" id="channels-dark-root">
        <title id="channels-dark-title">The channel: Docker Desktop and Kiri side by side</title>
        <desc id="channels-dark-desc">Two installations. With Docker Desktop the container end connects over TCP to host.docker.internal:PORT and reaches the server, which listens on 127.0.0.1:PORT on the Mac, 47800 for MLX and 47700 for PyTorch; any other container of the engine reaches the same port. With Kiri and the patches, a container started with --gpus all has a listener at 127.0.0.1:47700 in its own network namespace; Kiri's guest agent relays each connection over vsock, port 1041, framed, to the Kiri daemon on the Mac, which connects it to the Unix socket ~/.kiri/run/gpu.sock where the server listens. A container started without --gpus has no listener and no bridge. There is one socket, so one bridge's server at a time.</desc>
        <defs>
      <style>#channels-dark-root { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      #channels-dark-root .t-name { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
      #channels-dark-root .t-part { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; }
      #channels-dark-root .t-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; }
      #channels-dark-root .t-sub { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; }
      #channels-dark-root .t-subb { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; }
      #channels-dark-root .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 400; }
      #channels-dark-root .t-msg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
      #channels-dark-root .t-eye { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; }
      #channels-dark-root .t-fig { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; font-weight: 600; }
