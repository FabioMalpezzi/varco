      #channels-dark-root .rule { stroke: #515462; }
      #channels-dark-root .c-ink { fill: #f5f5f5; }
      #channels-dark-root .c-muted { fill: #bfc0c0; }
      #channels-dark-root .c-soft { fill: #aab2c4; }
      #channels-dark-root .c-inv { fill: #2d3142; }
      #channels-dark-root .c-inv2 { fill: #555866; }</style>
          <marker id="channels-dark-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon class="mk" points="0 0, 10 4, 0 8"/></marker>
          <marker id="channels-dark-arrow-strong" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon class="mk-strong" points="0 0, 12 5, 0 10"/></marker>
          <marker id="channels-dark-arrow-faint" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon class="mk-faint" points="0 0, 10 4, 0 8"/></marker>
        </defs>
        <rect class="sheet" x="0.5" y="0.5" width="879" height="603" rx="10"/>
        <!-- zones: the virtual machine and macOS -->
        <g class="l-zones">
          <rect class="zone vm" x="20" y="48" width="488" height="232" rx="8"/>
          <text x="34" y="68" class="t-eye c-soft">LINUX VIRTUAL MACHINE</text>
          <rect class="zone mac" x="640" y="48" width="220" height="232" rx="8"/>
          <text x="654" y="68" class="t-eye c-soft">macOS</text>
          <rect class="zone vm" x="20" y="328" width="488" height="256" rx="8"/>
          <text x="34" y="348" class="t-eye c-soft">LINUX VIRTUAL MACHINE</text>
          <rect class="zone mac" x="640" y="328" width="220" height="256" rx="8"/>
          <text x="654" y="348" class="t-eye c-soft">macOS</text>
        </g>
        <!-- containers -->
        <g class="l-ctrs">
          <rect class="ctr-fill" x="36" y="80" width="280" height="88" rx="6"/>
          <path class="ctr-head" d="M 36,104 V 86 Q 36,80 42,80 H 310 Q 316,80 316,86 V 104 Z"/>
          <rect class="ctr" x="36" y="80" width="280" height="88" rx="6"/>
          <text x="48" y="96.5" class="t-eye c-muted">CONTAINER</text>
          <rect class="ctr-fill" x="36" y="180" width="280" height="88" rx="6"/>
          <path class="ctr-head" d="M 36,204 V 186 Q 36,180 42,180 H 310 Q 316,180 316,186 V 204 Z"/>
          <rect class="ctr" x="36" y="180" width="280" height="88" rx="6"/>
          <text x="48" y="196.5" class="t-eye c-muted">CONTAINER</text>
          <text x="125.3" y="196.5" class="t-sub c-muted">any other one</text>
          <rect class="ctr-fill" x="36" y="360" width="264" height="112" rx="6"/>
          <path class="ctr-head" d="M 36,384 V 366 Q 36,360 42,360 H 294 Q 300,360 300,366 V 384 Z"/>
          <rect class="ctr" x="36" y="360" width="264" height="112" rx="6"/>
          <text x="48" y="376.5" class="t-eye c-muted">CONTAINER</text>
          <text x="125.3" y="376.5" class="t-sub c-muted"><tspan class="t-mono">--gpus all</tspan></text>
          <rect class="ctr-fill" x="36" y="484" width="264" height="88" rx="6"/>
          <path class="ctr-head" d="M 36,508 V 490 Q 36,484 42,484 H 294 Q 300,484 300,490 V 508 Z"/>
          <rect class="ctr" x="36" y="484" width="264" height="88" rx="6"/>
          <text x="48" y="500.5" class="t-eye c-muted">CONTAINER</text>
          <text x="125.3" y="500.5" class="t-sub c-muted">no <tspan class="t-mono">--gpus</tspan></text>
        </g>
        <!-- the channel -->
        <g class="l-bands">
          <rect class="band" x="512" y="104" width="124" height="164" rx="6"/>
          <rect class="band" x="512" y="396" width="124" height="64" rx="6"/>
        </g>
        <!-- connectors -->
        <g class="l-lines">
          <path class="ln " d="M 304,136 L 656,136" marker-end="url(#channels-dark-arrow)"/>
          <path class="ln " d="M 304,236 L 656,236" marker-end="url(#channels-dark-arrow)"/>
          <path class="ln " d="M 288,428 L 320,428" marker-end="url(#channels-dark-arrow)"/>
          <path class="ln " d="M 496,428 L 656,428" marker-end="url(#channels-dark-arrow)"/>
          <path class="ln " d="M 684,456 L 684,508" marker-end="url(#channels-dark-arrow)"/>
        </g>
        <!-- connector labels -->
        <g class="l-labels">
          <text x="574" y="182" class="t-sub c-ink mid">one TCP port</text>
          <text x="574" y="198" class="t-sub c-ink mid">of the Mac</text>
          <text x="574" y="417" class="t-sub c-ink mid">vsock, port 1041</text>
          <text x="574" y="447" class="t-sub c-muted mid">framed</text>
          <text x="698" y="479" class="t-sub c-muted">Unix socket</text>
          <text x="698" y="495" class="t-mono c-muted">~/.kiri/run/gpu.sock</text>
        </g>
        <!-- nodes -->
        <g class="l-nodes">
          <rect class="n-end" x="48" y="112" width="256" height="48" rx="6"/>
          <text x="176" y="131.8" class="t-sub c-muted mid">the container end connects to</text>
          <text x="176" y="147.8" class="t-msg c-ink mid">host.docker.internal:PORT</text>
          <rect class="n-end" x="48" y="212" width="256" height="48" rx="6"/>
          <text x="176" y="231.8" class="t-sub c-muted mid">reaches the same port</text>
          <text x="176" y="247.8" class="t-msg c-ink mid">host.docker.internal:PORT</text>
          <rect class="n-end" x="656" y="104" width="188" height="164" rx="6"/>
          <text x="750" y="158.8" class="t-name c-ink mid">the server</text>
          <text x="750" y="175.8" class="t-sub c-muted mid">listens on</text>
          <text x="750" y="191.8" class="t-msg c-ink mid">127.0.0.1:PORT</text>
          <text x="750" y="207.8" class="t-sub c-muted mid">47800 for MLX</text>
          <text x="750" y="223.8" class="t-sub c-muted mid">47700 for PyTorch</text>
          <rect class="n-end" x="48" y="392" width="240" height="72" rx="6"/>
          <text x="168" y="407.8" class="t-sub c-muted mid">the container end connects to</text>
          <text x="168" y="423.8" class="t-msg c-ink mid">127.0.0.1:47700</text>
          <text x="168" y="439.8" class="t-sub c-muted mid">a listener in the container's</text>
          <text x="168" y="455.8" class="t-sub c-muted mid">own network namespace</text>
          <rect class="n-none" x="48" y="516" width="240" height="48" rx="6"/>
          <text x="168" y="543.8" class="t-sub c-muted mid">no listener, no bridge</text>
          <rect class="n-part" x="320" y="396" width="176" height="64" rx="6"/>
          <text x="408" y="424.6" class="t-part c-ink mid">Kiri's guest agent</text>
          <text x="408" y="441.3" class="t-sub c-muted mid">relays each connection</text>
          <rect class="n-part" x="656" y="400" width="188" height="56" rx="6"/>
          <text x="750" y="432.6" class="t-part c-ink mid">Kiri daemon</text>
          <rect class="n-end" x="656" y="508" width="188" height="64" rx="6"/>
          <text x="750" y="528.8" class="t-name c-ink mid">the server</text>
          <text x="750" y="545.8" class="t-sub c-muted mid">one socket: one bridge's</text>
          <text x="750" y="561.8" class="t-sub c-muted mid">server at a time</text>
        </g>
        <!-- notes -->
        <g class="l-text">
          <text x="20" y="36" class="t-name c-ink">Docker Desktop</text>
          <text x="212" y="36" class="t-sub c-muted">nothing else is needed; every container of the engine can reach the port</text>
          <text x="20" y="316" class="t-name c-ink">Kiri with the patches</text>
          <text x="212" y="316" class="t-sub c-muted">only a container started with <tspan class="t-mono">--gpus all</tspan> gets a bridge</text>
        </g>
      </svg>
